[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5174
  port = 8888

[[redirects]]
  from = "/api/metar"
  to = "/.netlify/functions/metar"
  status = 200
  force = true